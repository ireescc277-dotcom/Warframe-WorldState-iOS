name: WarframeWatch CI/CD & Visual Verification

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    name: 1. Swift Runtime & Data Decoding Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          swift --version

      - name: Compile and Run Test Runner
        run: |
          echo "=== Compiling test_runner executable ==="
          swiftc -O \
            WarframeWatch/Models/ArbitrationInfo.swift \
            WarframeWatch/Models/CommunityModels.swift \
            WarframeWatch/Models/FocusModels.swift \
            WarframeWatch/Models/InventoryModel.swift \
            WarframeWatch/Models/MissionModels.swift \
            WarframeWatch/Models/MongoExtendedJSON.swift \
            WarframeWatch/Models/SnapshotDiff.swift \
            WarframeWatch/Models/WatchItem.swift \
            WarframeWatch/Models/WatchTree.swift \
            WarframeWatch/Models/WorldState.swift \
            WarframeWatch/Services/DictionaryService.swift \
            Tests/main.swift \
            -o test_runner
          
          echo "=== Executing test_runner ==="
          ./test_runner

  simulator-visual-test:
    name: 2. iOS Simulator Boot & Fullscreen Visual Quality Gate
    needs: runtime-tests
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install Pillow

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Boot Simulator & Build App
        run: |
          echo "=== Finding Available iPhone Simulator ==="
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (15|16)" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          fi
          echo "Selected Simulator UDID: $UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          
          echo "=== Booting Simulator & Waiting for SpringBoard ==="
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          
          echo "=== Configuring Simulator (Dark Mode & Status Bar) ==="
          xcrun simctl ui $UDID appearance dark
          xcrun simctl status_bar $UDID override --time "9:41" --batteryState charged --batteryLevel 100
          
          echo "=== Building WarframeWatch for Simulator ==="
          xcodebuild \
            -project WarframeWatch.xcodeproj \
            -scheme WarframeWatch \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build_sim \
            clean build
          
          APP_PATH=$(find build_sim/Build/Products -name "WarframeWatch.app" -type d | head -n 1)
          echo "App path: $APP_PATH"
          echo "BUILT_APP_PATH=$APP_PATH" >> $GITHUB_ENV
          
          echo "=== Inspecting & Enforcing LaunchScreen in App Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PATH/Info.plist"
          plutil -p "$APP_PATH/Info.plist"

      - name: Install & Launch App on Simulator
        run: |
          echo "=== Installing App into Simulator ==="
          xcrun simctl uninstall $SIM_UDID com.warframe.watch || true
          xcrun simctl install $SIM_UDID "$BUILT_APP_PATH"
          
          echo "=== Launching App ==="
          xcrun simctl launch $SIM_UDID com.warframe.watch
          echo "Waiting 6 seconds for network fetch and UI render..."
          sleep 6

      - name: Capture Simulator Screenshots
        run: |
          # 首次启动会弹一次 Apple Intelligence 系统横幅，它会盖在页头上。
          # 先开一次让这张横幅消耗掉，再开始拍。
          xcrun simctl launch $SIM_UDID com.warframe.watch -startTab 0 >/dev/null 2>&1 || true
          sleep 10
          xcrun simctl terminate $SIM_UDID com.warframe.watch >/dev/null 2>&1 || true

          # One screenshot per state. The app reads -startTab / -assetTab /
          # -assetSet from the command line, so this needs no tapping, which
          # simctl cannot do anyway.
          capture() {
            name=$1; shift
            xcrun simctl terminate $SIM_UDID com.warframe.watch >/dev/null 2>&1 || true
            xcrun simctl launch $SIM_UDID com.warframe.watch "$@" >/dev/null
            sleep 4
            xcrun simctl io $SIM_UDID screenshot "$name.png"
            ls -lh "$name.png"
          }
          capture dashboard_preview -startTab 0
          capture screen_watch -startTab 1
          capture screen_assets -startTab 2
          capture screen_assets_relics -startTab 2 -assetTab relics
          capture screen_assets_aya -startTab 2 -assetTab aya
          capture screen_assets_detail -startTab 2 -assetSet "Hildryn Prime"
          capture screen_cycle -startTab 3
          capture screen_more -startTab 4

      - name: Run Automated Visual Quality Gate
        run: |
          python scripts/verify_screenshots.py \
            dashboard_preview.png screen_watch.png screen_assets.png \
            screen_assets_relics.png screen_assets_aya.png \
            screen_assets_detail.png screen_cycle.png screen_more.png

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-dashboard-preview
          path: |
            dashboard_preview.png
            screen_watch.png
            screen_assets.png
            screen_assets_relics.png
            screen_assets_aya.png
            screen_assets_detail.png
            screen_cycle.png
            screen_more.png
          retention-days: 14

      - name: Add Step Summary
        run: |
          echo "### 📱 iOS Simulator Fullscreen Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Simulator UDID: \`$SIM_UDID\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dark Mode & Status Bar: Configured" >> $GITHUB_STEP_SUMMARY
          echo "- LaunchScreen & Native Geometry: Verified (No Letterbox)" >> $GITHUB_STEP_SUMMARY
          echo "- Theme Elements & Live/Bundled Warframe Data: Verified" >> $GITHUB_STEP_SUMMARY

  build-and-package-ipa:
    name: 3. Build & Package Verified iOS IPA
    needs: simulator-visual-test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Screenshot Artifact
        uses: actions/download-artifact@v4
        with:
          name: simulator-dashboard-preview
        continue-on-error: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project WarframeWatch.xcodeproj \
            -scheme WarframeWatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WarframeWatch.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Enforce Plist and Resources in Archive
        run: |
          APP="build/WarframeWatch.xcarchive/Products/Applications/WarframeWatch.app"
          echo "=== Inspecting Archive Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP/Info.plist"
          plutil -p "$APP/Info.plist"

          echo "=== Checking Version Keys ==="
          # These were absent for a while: the plist is generated, so the
          # values in project.yml's info block never reached the bundle.
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" 2>/dev/null) || exit 1
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" 2>/dev/null) || exit 1
          echo "✅ version $SHORT ($BUILD)"

          echo "=== Checking App Icon ==="
          if [ -f "$APP/Assets.car" ]; then
            echo "✅ Assets.car present"
          elif compgen -G "$APP/AppIcon*.png" > /dev/null; then
            echo "✅ AppIcon pngs present"
          else
            echo "❌ no app icon in bundle"
            exit 1
          fi

          echo "=== Checking Critical App Bundle Resources ==="
          test -d "$APP/LaunchScreen.storyboardc" && echo "✅ LaunchScreen.storyboardc present" || exit 1
          test -f "$APP/DefaultSnapshot.json" && echo "✅ DefaultSnapshot.json present" || exit 1
          test -f "$APP/DefaultDict.json" && echo "✅ DefaultDict.json present" || exit 1

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/WarframeWatch.xcarchive/Products/Applications/WarframeWatch.app Payload/
          zip -r -9 WarframeWatch-unsigned.ipa Payload
          ls -lh WarframeWatch-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarframeWatch-unsigned-ipa
          path: WarframeWatch-unsigned.ipa
          retention-days: 30

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WarframeWatch-unsigned.ipa
            dashboard_preview.png
          name: Release ${{ github.ref_name }}
          body: |
            ## WarframeWatch iOS ${{ github.ref_name }}
            
            ### ✅ Verification Passed:
            - **Swift Runtime Decoder**: 100% verified against live Warframe API & local snapshot.
            - **Simulator Fullscreen Gate**: Verified on iPhone simulator (No letterboxing, full native aspect ratio).
            - **LaunchScreen Storyboard**: Compiled & injected into Info.plist (`UILaunchStoryboardName: LaunchScreen`).
            - **Bundled Resources**: `DefaultSnapshot.json` & `DefaultDict.json` included in app bundle.
            
            ### 📦 Sideload Installation:
            Download `WarframeWatch-unsigned.ipa` and install using **TrollStore**, **AltStore**, or **SideStore**.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
