name: Run Swift Runtime Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Execute Swift Verification Test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Run Runtime Decoder Test
        run: |
          swiftc \
            WarframeWatch/Models/MongoExtendedJSON.swift \
            WarframeWatch/Models/FocusModels.swift \
            WarframeWatch/Models/MissionModels.swift \
            WarframeWatch/Models/CommunityModels.swift \
            WarframeWatch/Models/SnapshotDiff.swift \
            WarframeWatch/Models/WatchItem.swift \
            WarframeWatch/Models/WorldState.swift \
            Tests/test_runner.swift \
            -o test_runner
          ./test_runner
