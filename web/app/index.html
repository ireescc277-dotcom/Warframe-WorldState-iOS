<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Warframe 伤害计算</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <div class="brand">WARFRAME <b>伤害计算</b><span id="buildinfo"></span></div>
  <div class="sp"></div>
  <button class="hbtn" id="btn-save">存档</button>
  <button class="hbtn" id="btn-note">口径</button>
</header>

<!-- 左上选武器，右上选敌人。敌人等级/钢铁/卓越者都属于敌人，放它卡里。 -->
<div class="top">
  <div class="pick" id="pick-w">
    <div class="pickhd"><span class="pt">武器</span><span class="sp"></span><span class="chip" id="wcount">—</span></div>
    <div class="pinput">
      <input id="wsearch" placeholder="搜索或选择武器…" autocomplete="off" spellcheck="false">
      <span class="car">▾</span>
      <div class="plist" id="wlist"></div>
    </div>
    <div class="pcard" id="wcard"><div class="empty">先选武器</div></div>
  </div>

  <div class="pick" id="pick-t">
    <div class="pickhd"><span class="pt">敌人</span><span class="sp"></span><span class="chip" id="ecount">—</span></div>
    <div class="pinput">
      <input id="esearch" placeholder="搜索或选择敌人…" autocomplete="off" spellcheck="false">
      <span class="car">▾</span>
      <div class="plist" id="elist">
        <div class="fchips" id="fchips"></div>
        <div id="elistbody"></div>
      </div>
    </div>
    <div class="pcard" id="tcard">
      <div class="tname" id="tname">—</div>
      <div class="tgtlevel">
        <div class="row">
          <span class="lb">等级</span>
          <input type="range" id="lvl-range" min="1" max="200" value="100">
          <input type="number" id="lvl-num" class="num" min="1" max="9999" value="100">
        </div>
        <div class="estat" id="estat"></div>
        <div class="facres" id="facres"></div>
        <div class="tflags" id="tflags"></div>
        <div class="tnote" id="tnote"></div>
      </div>
    </div>
  </div>
</div>

<!-- 配卡：武器槽位 + 右侧概要 -->
<div class="build" id="bwrap">
  <div class="slots" id="slots"></div>
  <div class="side" id="wside"></div>
</div>

<!-- 战甲：光环 / 4 mod / 2 赋能 / 5 执政官碎片。这些同样进计算。 -->
<div class="frame" id="frame">
  <button class="frhd" id="fr-toggle" aria-expanded="true">
    <span class="frt">战甲</span>
    <span class="frs">光环 · Mod · 赋能 · 执政官碎片</span>
    <span class="frc" id="fr-count">0</span>
    <span class="frar">▾</span>
  </button>
  <div class="frbody" id="frbody"></div>
</div>

<!-- 下：左条件，右结果 -->
<div class="lower">
  <aside class="optpanel">
    <div class="opthd"><span>条件</span><b id="opt-n">0</b><span class="s">不计入武器本体</span>
      <button class="ohadd" id="btn-custom">自定义属性<b id="cst-n"></b></button></div>
    <div id="optgroups"></div>
  </aside>
  <section class="respanel">
    <div class="rbar" id="rbar"></div>
    <div id="brk"></div>
    <div class="attacks" id="attacks"></div>
  </section>
</div>

<div id="modal">
  <div class="mbox">
    <div class="mhd">
      <input id="m-search" placeholder="搜索…" autocomplete="off" spellcheck="false">
      <span class="mtitle" id="m-title" style="display:none"></span>
      <button class="x" id="m-close">关闭</button>
    </div>
    <div class="mlist" id="m-list"></div>
    <div class="mfoot" id="m-foot"></div>
  </div>
</div>

<div id="banner"></div>
<script src="site/weapon-index.js"></script>
<script src="kernel-web.js"></script>
<script src="app.js"></script>
</body>
</html>
