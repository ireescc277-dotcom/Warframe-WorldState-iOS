<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warframe 伤害计算</title>
<style>
:root{
  --bg:#0c0e11; --panel:#14171c; --panel2:#1a1e25; --line:#272d36;
  --fg:#dde2e8; --mute:#78828f; --gold:#c9a227; --gold2:#e0bc49;
  --red:#d9584f; --green:#4fa86a; --blue:#5b9bd5;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:13px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;padding:6px 8px;outline:none}
input:focus{border-color:var(--gold)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2e3540;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3b4450}

header{
  height:46px;flex:none;display:flex;align-items:center;gap:12px;
  padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);
}
header .ttl{font-weight:600;letter-spacing:.5px}
header .ttl b{color:var(--gold)}
header .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{padding:4px 10px;color:var(--mute);font-size:12px}
.seg button.on{background:var(--gold);color:#1a1408;font-weight:600}
.seg button:not(.on):hover{background:var(--panel2);color:var(--fg)}
.hbtn{padding:4px 10px;border:1px solid var(--line);border-radius:4px;color:var(--mute);font-size:12px}
.hbtn:hover{color:var(--fg);border-color:#3d4550}

main{flex:1;display:grid;grid-template-columns:264px minmax(420px,1fr) 292px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.col:last-child{border-right:none}
.colhd{
  flex:none;padding:8px 12px;font-size:11px;letter-spacing:1px;color:var(--mute);
  text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px
}
.colhd span{flex:1}
.list{flex:1;overflow-y:auto;padding:6px}
.item{
  display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:4px;
  cursor:pointer;border:1px solid transparent;
}
.item:hover{background:var(--panel2)}
.item.on{background:#22262e;border-color:var(--gold)}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:11px;color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.badge{font-size:10px;padding:1px 5px;border-radius:3px;background:#2a3038;color:var(--mute)}
.badge.hi{background:#1e2a1f;color:#6fae7f}
.badge.lo{background:#2e2621;color:#c08a5e}
.rank{width:20px;text-align:right;color:#4d5661;font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.item.on .rank{color:var(--gold)}

#build{position:relative}
.bwrap{padding:14px 16px;overflow-y:auto;flex:1}
.wtitle{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.wtitle h2{margin:0;font-size:18px;font-weight:600}
.wtitle .en{color:var(--mute);font-size:12px}
.wtitle .trig{font-size:10px;padding:1px 6px;border-radius:3px;background:#2e2621;color:#c08a5e}
.wstats{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 12px;font-size:12px;color:var(--mute)}
.wstats b{color:var(--fg);font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:3px 12px;border:1px solid var(--line);border-radius:4px;color:var(--mute);font-size:12px}
.tabs button.on{border-color:var(--gold);color:var(--gold);background:#1d1a10}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px}
.slot{
  height:76px;border:1px solid var(--line);border-radius:5px;background:var(--panel);
  display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;
  cursor:pointer;position:relative;transition:.1s;
}
.slot:hover{border-color:#3d4550}
.slot.empty{border-style:dashed;color:#4d5661;align-items:center;justify-content:center;font-size:20px}
.slot.empty:hover{color:var(--gold);border-color:var(--gold)}
.slot .snm{font-size:12px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot .rkw{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.slot .rkw b{color:var(--gold2);font-weight:600}
.slot .rkw button{padding:0 3px}
.slot .rm{position:absolute;top:2px;right:4px;color:#4d5661;font-size:13px;opacity:0}
.slot:hover .rm{opacity:1}
.slot .rm:hover{color:var(--red)}
.slot .verbad{color:var(--red);font-size:11px}
.contrib{margin-top:14px;max-width:640px;border-top:1px solid var(--line);padding-top:8px}
.contrib .cr{display:flex;gap:10px;align-items:baseline;padding:3px 0;font-size:11.5px}
.contrib .cn{flex:none;width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contrib .cl{flex:none;width:52px;color:var(--gold2);font-variant-numeric:tabular-nums}
.contrib .cv{color:var(--mute)}
.contrib .cr:nth-child(odd){background:#12151a}
.incpane{margin-top:14px;max-width:640px;border-top:1px solid var(--line);padding-top:9px}
.incpane .ihd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.incpane .ihl{font-size:11.5px;color:var(--mute)}
.incpane .ihl b{color:#9d8ae0;font-weight:500}
.incpane .incseg button{font-size:11px;padding:3px 10px}
.incpane .ir{display:flex;gap:9px;align-items:baseline;padding:3px 0;font-size:11.5px}
.incpane .ir:nth-child(odd){background:#12151a}
.incpane .it{flex:none;width:26px;color:#7c6fb0;font-variant-numeric:tabular-nums}
.incpane .in{flex:none;width:150px;color:#c9c3e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incpane .iv{color:var(--mute);font-variant-numeric:tabular-nums}
.incpane .ifoot{margin-top:7px;font-size:10.5px;color:#5a636e;line-height:1.6}
.rvlist{display:grid;grid-template-columns:1fr 1fr;gap:1px 16px;padding:6px 12px 14px}
.rvr{padding:6px 0;border-bottom:1px solid var(--line)}
.rvh{display:flex;gap:8px;align-items:baseline;font-size:12px}
.rvh b{color:#b9a06a;font-weight:500}
.rvh .rw{color:var(--mute);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvh .rvt{color:#5a636e;font-size:10px;flex:none}
.rvs{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px}
.rvs .st{color:#8ec7a0;font-variant-numeric:tabular-nums}
.rvs .st.cur{color:#c98a8a}
.simpane{margin-top:16px;max-width:640px;border-top:1px solid var(--line);padding-top:10px}
.simpane .hd{font-size:11px;letter-spacing:1px;color:var(--mute);margin-bottom:8px}
.simpane .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.simpane .cell{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
.simpane .cell span{display:block;font-size:10px;color:var(--mute)}
.simpane .cell b{font-size:15px;font-variant-numeric:tabular-nums;font-weight:600}
.simpane .bar{height:6px;border-radius:3px;background:#22262e;margin-top:10px;overflow:hidden;display:flex}
.simpane .bar i{display:block;height:100%}
.simpane .lg{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-top:6px}
.simpane .lg em{font-style:normal;color:var(--fg)}

#enemyList{flex:1;overflow-y:auto;padding:6px;min-height:0}
.fchips{display:flex;flex-wrap:wrap;gap:4px;padding:0 8px 6px}
.fchips button{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--panel2);color:var(--mute)}
.fchips button.on{background:var(--gold);color:#1a1408}
.elvl{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.elvl .row{display:flex;align-items:center;gap:10px}
.elvl input[type=range]{flex:1;accent-color:var(--gold)}
.elvl .num{width:60px;text-align:center;font-variant-numeric:tabular-nums;padding:3px 4px}
.estat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;font-size:11px}
.estat div{background:#1d222a;border-radius:4px;padding:4px 7px}
.estat span{display:block;color:var(--mute);font-size:10px}
.estat b{font-variant-numeric:tabular-nums;font-size:12px}
.extq{padding:8px 12px}.extq .exh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--gold);margin-bottom:6px}
.extq .exh span{color:var(--mute);font-size:10px}
.extq .row{gap:8px;margin-bottom:5px}
.extq .lb2{font-size:11px;color:var(--mute);width:56px;flex:none}
.extq .pc{font-size:10px;color:var(--mute);width:14px}
.extq .chk{gap:14px;margin-top:7px}
.extq .chk label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute);cursor:pointer}
.facres{padding:7px 12px;border-bottom:1px solid var(--line);font-size:11px;line-height:1.7}
.facres b{color:#b9a06a;font-weight:500}

footer{
  flex:none;border-top:1px solid var(--line);background:var(--panel);
  display:grid;grid-template-columns:210px 210px 170px 1fr;height:190px;
}
.fbox{padding:10px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.fbox .lb{font-size:10.5px;color:var(--mute);letter-spacing:.4px}
.fbox .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.fbox .big.s{font-size:22px}
.fbox .cmp{font-size:11px;color:var(--mute);margin-top:3px;line-height:1.5}
.fbox .cmp b{font-weight:500;color:var(--fg)}
#brk{overflow-y:auto;padding:8px 12px}
table.brk{width:100%;border-collapse:collapse;font-size:11.5px}
table.brk th{text-align:right;color:var(--mute);font-weight:400;padding:2px 6px;border-bottom:1px solid var(--line)}
table.brk th:first-child{text-align:left}
table.brk td{padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid #1c2128}
table.brk td:first-child{text-align:left}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.pos{color:var(--green)} .neg{color:var(--red)}

#modal{position:fixed;inset:0;background:#08090bcc;display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
.mbox{width:540px;max-height:76vh;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #000a}
.mhd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.mhd input{flex:1}
.mlist{overflow-y:auto;padding:6px}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:4px;cursor:pointer}
.mrow:hover{background:var(--panel2)}
.mrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .meta{font-size:11px;color:var(--mute);flex:none}
.foot{flex:none;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}
.note{font-size:11px;color:var(--mute);margin-top:10px;line-height:1.65}
.note b{color:#b9a06a;font-weight:500}
.note p{margin:5px 0}
.warn{color:#c08a5e}
code{background:#1d222a;padding:0 4px;border-radius:3px;font-size:11px;color:#b9c4d0}
</style>
</head>
<body>

<header>
  <div class="ttl">WARFRAME <b>伤害计算</b></div>
  <div class="sp"></div>
  <div class="seg" id="stseg">
    <button data-v="1" class="on">含状态</button>
    <button data-v="0">仅直伤</button>
  </div>
  <div class="seg" id="spseg">
    <button data-v="0" class="on">普通</button>
    <button data-v="1">钢铁 +100</button>
  </div>
  <button class="hbtn" id="btnriven">紫卡</button>
  <button class="hbtn" id="btnnote">口径</button>
</header>

<main>
  <aside class="col">
    <div class="colhd">
      <span id="ltitle">武器</span>
      <span id="wcount" class="badge"></span>
      <button class="hbtn" id="btnmode" style="padding:1px 6px;font-size:11px">排名</button>
    </div>
    <div style="padding:0 8px 6px"><input id="wsearch" placeholder="搜索武器…" style="width:100%"></div>
    <div class="list" id="wlist"></div>
  </aside>

  <section class="col" id="build">
    <div class="bwrap" id="bwrap">
      <div style="color:var(--mute)">左侧选一把武器。</div>
    </div>
  </section>

  <aside class="col">
    <div class="colhd"><span>目标</span><span id="ecount" class="badge"></span></div>
    <div class="elvl">
      <div class="row">
        <span style="font-size:11px;color:var(--mute)">等级</span>
        <input type="range" id="lvlrange" min="1" max="200" value="100">
        <input type="number" id="lvlnum" class="num" min="1" max="9999" value="100">
      </div>
      <div class="estat" id="estat"></div>
    </div>
    <div class="elvl extq">
      <div class="exh">外部条件<span>不计入武器本体</span></div>
      <div class="row"><span class="lb2">病毒层数</span>
        <input type="range" id="xvirR" min="0" max="10" value="0">
        <input type="number" id="xvir" class="num" min="0" max="10" value="0"></div>
      <div class="row"><span class="lb2">剥甲</span>
        <input type="range" id="xarmR" min="0" max="100" value="0">
        <input type="number" id="xarm" class="num" min="0" max="100" value="0"><span class="pc">%</span></div>
      <div class="row"><span class="lb2">时间窗口</span>
        <input type="range" id="xwinR" min="3" max="60" value="10">
        <input type="number" id="xwin" class="num" min="3" max="60" value="10"><span class="pc">秒</span></div>
      <div class="row chk"><label><input type="checkbox" id="xhd"> 爆头 ×2</label>
        <label><input type="checkbox" id="xcrit" checked> 计入暴击</label></div>
      <div class="row"><span class="lb2">伤害加成</span>
        <input type="range" id="xbufR" min="0" max="500" value="0">
        <input type="number" id="xbuf" class="num" min="0" max="500" value="0"><span class="pc">%</span></div>
      <div class="row"><span class="lb2">暴击加成</span>
        <input type="range" id="xccR" min="0" max="200" value="0">
        <input type="number" id="xcc" class="num" min="0" max="200" value="0"><span class="pc">%</span></div>
      <div class="row" style="margin-top:2px"><span style="font-size:10px;color:#5a636e;line-height:1.5">
        伤害加成对应 Roar / Eclipse / Xata's Whisper 一类外部增伤；暴击加成对应 Covenant / Wrathful Advance。</span></div>
    </div>
    <div class="facres" id="facres"></div>
    <div style="padding:6px 8px 0"><input id="esearch" placeholder="搜索敌人…" style="width:100%"></div>
    <div class="fchips" id="fchips"></div>
    <div id="enemyList"></div>
  </aside>
</main>

<footer>
  <div class="fbox">
    <div class="lb">直伤 BURST · 不计状态</div>
    <div class="big" id="rburst">—</div>
    <div class="cmp" id="rburstcmp"></div>
  </div>
  <div class="fbox">
    <div class="lb" id="dpslbl">含状态 · 10 秒实战</div>
    <div class="big s" id="rdps">—</div>
    <div class="cmp" id="rdpscmp"></div>
  </div>
  <div class="fbox">
    <div class="lb">击杀时间 TTK</div>
    <div class="big s" id="rttk">—</div>
    <div class="cmp" id="rttkcmp"></div>
  </div>
  <div id="brk"></div>
</footer>

<div id="modal"><div class="mbox">
  <div class="mhd"><input id="msearch" placeholder="搜索 mod…"><span id="mttl" style="flex:1;display:none;font-size:13px">口径与数据来源</span><button id="mclose" style="color:var(--mute)">关闭</button></div>
  <div class="mlist" id="mlist"></div>
  <div class="foot" id="mfoot"></div>
</div></div>

<script>
const W = WF.w, M = WF.m, E = WF.e;

const DT = ["impact","puncture","slash","heat","cold","electricity","toxin",
            "blast","radiation","magnetic","viral","corrosive","gas"];
const ZH = {impact:"冲击",puncture:"穿刺",slash:"切割",heat:"火焰",cold:"冰冻",
  electricity:"电击",toxin:"毒素",blast:"爆炸",radiation:"辐射",magnetic:"磁力",
  viral:"病毒",corrosive:"腐蚀",gas:"毒气"};
const COL = {impact:"#9aa3ad",puncture:"#b98c5a",slash:"#c0504d",heat:"#e07a3f",
  cold:"#5fa8d3",electricity:"#8a6fd0",toxin:"#5aa06a",blast:"#c96f4a",
  radiation:"#c9c04a",magnetic:"#7f8fd0",viral:"#8fbf6a",corrosive:"#8fae4a",gas:"#7fae7f"};
const PHYS = new Set(["impact","puncture","slash"]);
const ELEM_ORDER = ["heat","cold","electricity","toxin"];
const ALLELEM = ["heat","cold","electricity","toxin","blast","radiation","magnetic","viral","corrosive","gas"];
const COMBO_OF = {"heat|cold":"blast","heat|electricity":"radiation","heat|toxin":"gas",
  "cold|electricity":"magnetic","cold|toxin":"viral","electricity|toxin":"corrosive"};

// ---------------------------------------------------------------- 阵营克制
// Update 36（2024-06-18）起血量/护甲/护盾类型合并，克制只按阵营查：
// 弱点 ×1.5、抗性 ×0.5。来源：Warframe Wiki 伤害总览表 + warframe.today（2026-09 复核）。
const FACMOD = {
  "Grineer":        {impact:1.5, corrosive:1.5},
  "Kuva Grineer":   {impact:1.5, corrosive:1.5, heat:0.5},
  "Corpus":         {puncture:1.5, magnetic:1.5},
  "Corpus Amalgam": {electricity:1.5, magnetic:1.5, blast:0.5},
  "Infested":       {slash:1.5, heat:1.5},
  "Infested Deimos":{blast:1.5, gas:1.5, viral:0.5},
  "Orokin":         {puncture:1.5, viral:1.5, radiation:0.5},
  "Sentient":       {cold:1.5, radiation:1.5, corrosive:0.5},
  "Narmer":         {slash:1.5, toxin:1.5, magnetic:0.5},
  "Murmur":         {electricity:1.5, radiation:1.5, viral:0.5},
  "Scaldra":        {impact:1.5, corrosive:1.5},
  "Techrot":        {magnetic:1.5, gas:1.5, cold:0.5},
  "Zariman":        {void:1.5}
};
function facMult(fk, t){ const m = FACMOD[fk]; return (m && m[t]) || 1; }

// ---------------------------------------------------------------- 状态效果
// 数值来源：Warframe Wiki / warframe.today / sanctumaeterna，2026-09 口径。
const ST = {
  viral:    {max:10, dur:6,  hp:[1.00, 0.25]},   // 首层 +100%，每层 +25%，10 层 +325%
  corrosive:{max:10, dur:8,  strip:0.26, cap:0.80},
  heat:     {dur:6, dot:0.50, strip:0.50},       // 燃烧：护甲上限 −50%
  slash:    {dur:6, dot:0.35},                   // 流血：35% 总伤/秒，无视护甲
  toxin:    {dur:6, dot:0.50}                    // 中毒：50% 毒素伤/秒，无视护盾
};

const CATT = {LongGuns:"PRIMARY",Pistols:"SECONDARY",Melee:"MELEE",
  SentinelWeapons:"SENTINEL",SpaceGuns:"ARCH-GUN",SpaceMelee:"ARCH-MELEE"};

// ---------------------------------------------------------------- 统计
function statVal(m, lv, k){
  const L = m.lv; if(!L || !L.length) return 0;
  const i = Math.max(0, Math.min(lv, L.length-1));
  const row = L[i]; if(!row) return 0;
  return row[k] || 0;
}
function aggregate(slots){
  const a = {dmg:0,cc:0,cd:0,ms:0,fr:0,sc:0,mag:0,rl:0,
             phys:{},elem:{},fac:{},bad:[]};
  for(const s of slots){
    if(!s) continue;
    const m = M[s.m];
    if(!m){ a.bad.push((s.m.split("/").pop()||"")); continue; }
    a.dmg += statVal(m,s.lv,"dmg");
    a.cc  += statVal(m,s.lv,"cc");
    a.cd  += statVal(m,s.lv,"cd");
    a.ms  += statVal(m,s.lv,"ms");
    a.fr  += statVal(m,s.lv,"fr");
    a.sc  += statVal(m,s.lv,"sc");
    a.mag += statVal(m,s.lv,"mag");
    a.rl  += statVal(m,s.lv,"rl");
    for(const t of ["impact","puncture","slash"]){
      const v = statVal(m,s.lv,t); if(v) a.phys[t]=(a.phys[t]||0)+v;
    }
    for(const t of ALLELEM){
      const v = statVal(m,s.lv,t); if(v) a.elem[t]=(a.elem[t]||0)+v;
    }
    for(const f of ["d_grineer","d_corpus","d_infested","d_corrupted","d_narmer","d_murmur","d_sentient"]){
      const v = statVal(m,s.lv,f); if(v) a.fac[f.slice(2)]=(a.fac[f.slice(2)]||0)+v;
    }
  }
  return a;
}

// 元素合流：先天元素排最前，之后按槽位顺序
function buildComponents(wp, a, slotOrder){
  const baseTotal0 = DT.reduce((s,t)=>s+(wp.dmg[DT.indexOf(t)]||0),0) || wp.td || 1;
  const dMul = 1 + a.dmg/100;
  const phys = [];
  for(const t of PHYS){
    let v = (wp.dmg[DT.indexOf(t)]||0) * dMul;
    if(a.phys[t]) v *= (1 + a.phys[t]/100);
    if(v > 0) phys.push({t,v,innate:true});
  }
  const q = [];
  for(const t of ELEM_ORDER){
    const v = (wp.dmg[DT.indexOf(t)]||0) * dMul;
    if(v > 0) q.push({t,v,innate:true});
  }
  for(const t of ["blast","radiation","magnetic","viral","corrosive","gas"]){
    const v = (wp.dmg[DT.indexOf(t)]||0) * dMul;
    if(v > 0) q.push({t,v,innate:true,combo:true});
  }
  for(const t of slotOrder){
    if(a.elem[t]) q.push({t, v: baseTotal0 * dMul * a.elem[t]/100, innate:false});
  }
  const out = [];
  let pend = null;
  for(const e of q){
    if(e.combo){ if(pend){ out.push(pend); pend=null; } out.push(e); continue; }
    if(!pend){ pend = {...e}; continue; }
    if(pend.t === e.t){ pend.v += e.v; continue; }
    const c = COMBO_OF[pend.t+"|"+e.t] || COMBO_OF[e.t+"|"+pend.t];
    if(c){ out.push({t:c, v: pend.v + e.v, innate: pend.innate&&e.innate}); pend=null; }
    else { out.push(pend); pend = {...e}; }
  }
  if(pend) out.push(pend);
  return phys.concat(out);
}

// ---------------------------------------------------------------- 等级缩放
// 每条曲线两端点 + smoothstep（L=70,U=80）。系数按阵营分叉，
// 取自 Wiki「Enemy Level Scaling」并与 warframe-damage.com 的实现逐项对齐。
// 每条曲线记作 [c1,e1,c2,e2]：f1=1+c1·q^e1，f2=1+c2·q^e2。
const SCALES = {
  _h: [0.015, 2.12, 10.7332, 0.72],
  _s: [0.02, 1.76, 2, 0.76],
  _a: [0.005, 1.75, 0.4, 0.75],
  "Infested":        {h:[0.0225,2.12,16.1,0.72]},
  "Infested Deimos": {h:[0.0225,2.12,16.1,0.72]},
  "Corpus":          {h:[0.015,2.12,13.416,0.55]},
  "Corpus Amalgam":  {h:[0.015,2.12,13.416,0.55]},
  "Orokin":          {h:[0.015,2.1,10.7332,0.685], s:[0.02,1.75,2,0.75]},
  "Techrot":         {h:[0.015,2.1,13.64,0.72],    s:[0.02,1.76,3.4106,0.76]},
  "Sentient":        {h:[0.015,2.0,10.7332,0.5],   s:[0.02,1.75,2,0.75]},
  "Murmur":          {h:[0.015,2.0,10.7332,0.5],   s:[0.02,1.75,2,0.75]}
};
function curve(fk, kind){
  const o = SCALES[fk] || {};
  return o[kind] || SCALES["_"+kind];
}
function multAt(c, q){
  if(q <= 0) return 1;
  const f1 = 1 + c[0]*Math.pow(q, c[1]);
  const f2 = 1 + c[2]*Math.pow(q, c[3]);
  const t = Math.min(1, Math.max(0, (q-70)/10));
  const s = t*t*(3-2*t);
  return f1 + (f2-f1)*s;
}
function scaleHealth(base, level, bl, fk){
  return base * multAt(curve(fk,"h"), level-(bl||1));
}
function scaleArmor(base, level, bl, fk){
  if(base <= 0) return 0;
  const v = base * multAt(curve(fk,"a"), level-(bl||1));
  return Math.max(200, Math.min(v, 2700));
}
function scaleShield(base, level, bl, fk){
  if(base <= 0) return 0;
  return base * multAt(curve(fk,"s"), level-(bl||1));
}
// 敌方护甲减伤：≤2700 用 0.9·√(A/2700)，超过则 A/(A+300)
function drOf(A){
  if(A <= 0) return 0;
  if(A <= 2700) return 0.9*Math.sqrt(A/2700);
  return A/(A+300);
}

// ---------------------------------------------------------------- 灵化
// 节点数值加在「基础值」上（Wiki 描述均为 Increase Base X by N），
// 所以先叠加到武器基础属性，再走 mod 的乘算。
// flatBaseDamage / additiveBaseDamage 只在灵化形态生效——它们描述的就是
// 灵化形态的基础伤害（Torid 的 +51 正好等于其灵化形态的 51 点基础伤害）。
function effWeapon(wp, inc, on){
  if(!inc) return wp;
  const b = Object.assign({}, wp);
  b.dmg = (wp.dmg || []).slice();
  if(on && inc.forms[1]){
    const f = inc.forms[1];
    b.td = f.td; b.cc = f.cc; b.cm = f.cm; b.sc = f.sc; b.fr = f.fr;
    if(f.mag != null && f.mag > 0) b.mag = f.mag;
    if(f.rl != null && f.rl > 0) b.rl = f.rl;
    if(f.ms != null && f.ms > 0) b.ms = f.ms;
    let sum = 0;
    const d = new Array(DT.length).fill(0);
    for(let i=0;i<DT.length;i++){ const v = f.dmg[DT[i]] || 0; d[i] = v; sum += v; }
    if(sum > 0) b.dmg = d;
  }
  let flat = 0, add = 0, ccA = 0, cmA = 0, scA = 0, frM = 0, rlM = 0, magM = 0,
      flatMag = 0, msA = 0;
  for(const p of inc.picked || []){
    const s = p.sc || {};
    if(on && s.flatBaseDamage) flat += s.flatBaseDamage;
    if(on && s.additiveBaseDamage) add += s.additiveBaseDamage;
    if(s.criticalChance) ccA += s.criticalChance;
    if(s.criticalMultiplier) cmA += s.criticalMultiplier;
    if(s.criticalMultiplierSet) b.cm = s.criticalMultiplierSet;
    if(s.critMultFlat) cmA += s.critMultFlat;
    if(s.statusChance) scA += s.statusChance;
    if(s.fireRate) frM += s.fireRate;
    if(s.reloadSpeed) rlM += s.reloadSpeed;
    if(s.magazine) magM += s.magazine;
    if(s.flatMagazine) flatMag += s.flatMagazine;
    if(s.multishot) msA += s.multishot;
  }
  if(flat || add){
    const old = b.td || 1;
    b.td = (old + flat) * (1 + add);
    const k = b.td / old;
    b.dmg = b.dmg.map(v => v * k);
  }
  b.cc = (b.cc || 0) + ccA;
  b.cm = (b.cm || 1) + cmA;
  b.sc = (b.sc || 0) + scA;
  b.fr = (b.fr || 1) * (1 + frM);
  b.rl = (b.rl || 0) / (1 + rlM);
  b.mag = Math.round(((b.mag || 1) + flatMag) * (1 + magM));
  b.ms = (b.ms || 1) + msA;
  return b;
}

// ---------------------------------------------------------------- 组装
const BANE_KEY = {Grineer:"grineer","Kuva Grineer":"grineer",Corpus:"corpus",
  "Corpus Amalgam":"corpus",Infested:"infested","Infested Deimos":"infested",
  Orokin:"corrupted",Sentient:"sentient",Narmer:"narmer",Murmur:"murmur"};

function assemble(wp, slots, enemy, level, opt){
  const a = aggregate(slots);
  const order = slots.filter(Boolean).map(s=>{
    const m=M[s.m]; if(!m) return null;
    return ALLELEM.filter(t=>statVal(m,s.lv,t)>0);
  }).filter(Boolean).flat();
  const comps = buildComponents(wp, a, order);

  const cc = (wp.cc||0)*100 * (1 + a.cc/100) + (opt.ccBuff || 0);
  const cm = (wp.cm||1) * (1 + a.cd/100);
  const critMul = (opt.crit === false) ? 1 : 1 + (cc/100)*(cm-1);
  const ms = (wp.ms||1) * (1 + a.ms/100);
  const fr = Math.max(0.05,(wp.fr||1) * (1 + a.fr/100));
  const mag = Math.max(1, Math.round((wp.mag||1) * (1 + a.mag/100)));
  const rl  = Math.max(0,(wp.rl||0) / (1 + a.rl/100));
  const sc  = Math.max(0,(wp.sc||0) * (1 + a.sc/100));

  const lv = level + (opt.steel ? 100 : 0);
  const fk = enemy.fk || "";
  const hp = scaleHealth(enemy.hp, lv, enemy.bl, fk);
  const arRaw = scaleArmor(enemy.ar, lv, enemy.bl, fk);
  const ar0 = Math.max(0, arRaw * (1 - (opt.armorStrip||0)/100));
  const sh = scaleShield(enemy.sh, lv, enemy.bl, fk);
  const banePct = (a.fac[BANE_KEY[fk]] || 0)/100;
  const headMul = opt.headshot ? 2 : 1;
  const buffMul = 1 + (opt.dmgBuff || 0)/100;

  const compsF = comps.map(c=>{
    const f = facMult(fk, c.t);
    return {t:c.t, v:c.v, f, vCrit:c.v*f*critMul*ms*(1+banePct)*headMul*buffMul};
  });
  const perShotShield = compsF.reduce((s,c)=>s+c.vCrit,0);
  const shotBase = comps.reduce((s,c)=>s+c.v,0) * ms;   // 不含暴击、不含加成

  return {a, comps:compsF, shotBase, perShotShield, cc, cm, critMul, ms, fr, mag, rl, sc,
          hp, ar0, sh, og:enemy.og||0, fk, banePct, lv,
          dr0: drOf(ar0)};
}

function healthPerShot(A, armor, viralMul){
  let toHealth = 0;
  for(const c of A.comps) toHealth += c.vCrit * (1 - drOf(armor)) * viralMul;
  return toHealth;
}

// 直伤口径：不叠状态、不剥甲
function direct(A){
  const rows = [];
  let toHealth = 0, toShield = 0;
  for(const c of A.comps){
    const dr = drOf(A.ar0);
    const vH = c.vCrit * (1 - dr);
    toHealth += vH; toShield += c.vCrit;
    rows.push({t:c.t, base:c.vCrit, f:c.f, dr, vH, share:0});
  }
  const tot = rows.reduce((s,r)=>s+r.vH,0) || 1;
  rows.forEach(r=>r.share = r.vH/tot);
  const burst = toHealth * A.fr;
  const sust = A.mag > 0 ? (toHealth * A.mag) / (A.mag/A.fr + A.rl) : burst;
  return {rows, toHealth, toShield, burst, sust};
}

// ---------------------------------------------------------------- 状态时间轴
// 确定性模拟：按期望值推进，不做随机抽样。
function simulate(A, opt){
  const T = Math.max(3, opt.window || 10), dt = 0.05;
  const baseViral = Math.min(10, opt.extViral || 0);
  let hp = A.hp, sh = A.sh, og = A.og, armor = A.ar0;
  let mag = A.mag || 1, reload = 0, t = 0;
  let viral = [], corr = [], heatUntil = -1, dots = [];
  let viralAcc = 0, corrAcc = 0;
  let dealt = 0, kill = null, dotTotal = 0, directTotal = 0;
  const N = Math.round(T/dt);
  const sumV = A.comps.reduce((s,x)=>s+x.v,0) || 1;
  const weights = A.comps.map(c=>({t:c.t, w:c.v/sumV}));
  const typeShot = {};
  for(const c of A.comps) typeShot[c.t] = (typeShot[c.t]||0) + c.v * A.ms;

  for(let i=0;i<N;i++){
    // 开火（含装填）
    let fired = 0;
    if(reload > 0){
      reload -= dt;
      if(reload <= 1e-6){ mag = A.mag || 1; reload = 0; }
    } else {
      fired = A.fr * dt;
      if(fired >= mag){
        fired = mag; mag = 0;
        if(A.rl > 0) reload = A.rl; else mag = A.mag || 1;
      } else mag -= fired;
    }

    // 挂状态：按期望值累积，小数部分留到下一步
    if(fired > 0){
      const procs = A.sc * A.ms * fired;
      for(const w of weights){
        const p = procs * w.w;
        if(p <= 1e-9) continue;
        if(w.t === "viral"){
          viralAcc += p;
          while(viralAcc >= 1){ viral.push(t + ST.viral.dur); viralAcc -= 1; }
        } else if(w.t === "corrosive"){
          corrAcc += p;
          while(corrAcc >= 1){ corr.push(t + ST.corrosive.dur); corrAcc -= 1; }
        } else if(w.t === "heat"){
          heatUntil = t + ST.heat.dur;
          dots.push({until:t+ST.heat.dur, n:"燃烧",
            dps: p * ST.heat.dot * typeShot.heat * (1+A.banePct)**2 * facMult(A.fk,"heat"),
            armor:true});
        } else if(w.t === "slash"){
          dots.push({until:t+ST.slash.dur, n:"流血",
            dps: p * ST.slash.dot * A.shotBase * (1+A.banePct)**2 * facMult(A.fk,"slash"),
            armor:false});
        } else if(w.t === "toxin"){
          dots.push({until:t+ST.toxin.dur, n:"中毒",
            dps: p * ST.toxin.dot * typeShot.toxin * (1+A.banePct)**2 * facMult(A.fk,"toxin"),
            armor:false, shieldPierce:true});
        }
      }
      viral = viral.filter(x=>x>t);
      const vcap = Math.max(0, 10 - baseViral);
      if(viral.length>vcap) viral = viral.slice(-vcap);
      corr  = corr.filter(x=>x>t);  if(corr.length>10)  corr  = corr.slice(-10);
    }
    dots = dots.filter(d=>d.until > t);

    // 病毒加伤 / 剥甲
    const vn = Math.min(10, baseViral + viral.length);
    const viralMul = vn > 0 ? 1 + (ST.viral.hp[0] + ST.viral.hp[1]*(vn-1)) : 1;
    const cStrip = Math.min(ST.corrosive.cap, ST.corrosive.strip * corr.length);
    const hStrip = (t < heatUntil) ? ST.heat.strip : 0;
    const strip = 1 - (1-cStrip)*(1-hStrip);
    const armorNow = Math.max(0, armor * (1-strip));

    let dmg = fired * healthPerShot(A, armorNow, viralMul);
    directTotal += dmg;

    let dotDmg = 0;
    for(const d of dots){
      let v = d.dps * dt * viralMul;
      if(d.armor) v *= (1 - drOf(armorNow));
      dotDmg += v;
    }
    dotTotal += dotDmg;
    dmg += dotDmg;

    if(sh > 0){
      const toS = Math.min(sh, dmg);
      sh -= toS; dmg -= toS;
    }
    if(og > 0){
      const toO = Math.min(og, dmg);
      og -= toO; dmg -= toO;
    }
    if(dmg > 0){
      hp -= dmg; dealt += Math.max(0, dmg);
      if(hp <= 0 && kill === null){
        kill = Math.max(0, t + dt*(1 + hp/dmg));
        hp = 0; break;
      }
    }
    t += dt;
  }

  const dur = kill !== null ? kill : Math.min(T, t) || T;
  const total = directTotal + dotTotal;
  const cStripEnd = Math.min(ST.corrosive.cap, ST.corrosive.strip * corr.length);
  return {
    dps: dur > 0 ? total/dur : 0,
    dps10: total/T,
    directDps: dur>0 ? directTotal/dur : 0,
    dotDps: dur>0 ? dotTotal/dur : 0,
    kill, viralAtEnd: viral.length, corrAtEnd: corr.length,
    stripAtEnd: cStripEnd, dur
  };
}

function compute(wp, slots, enemy, level, opt, uid){
  const inc = (WF.i && uid) ? WF.i[uid] : null;
  const wp2 = inc ? effWeapon(wp, inc, opt.incarnon) : wp;
  const A = assemble(wp2, slots, enemy, level, opt);
  const d = direct(A);
  const s = opt.status ? simulate(A, opt) : null;
  return {A, d, s, inc, wp2};
}

          <span>/ ${m.mx}</span></div>
          <button class="rm">×</button>`;
        d.querySelector(".rm").onclick = (e)=>{ e.stopPropagation(); state.slots[i]=null; renderBuild(); };
        d.querySelector(".up").onclick = (e)=>{ e.stopPropagation(); if(s.lv<m.mx){s.lv++; renderBuild();} };
        d.querySelector(".dn").onclick = (e)=>{ e.stopPropagation(); if(s.lv>0){s.lv--; renderBuild();} };
      }
    }
    slotsEl.appendChild(d);
  });
  while(slotsEl.children.length<8){
    const d=document.createElement("div"); d.className="slot empty"; d.textContent="+";
    const idx = slotsEl.children.length;
    d.onclick = ()=> openPicker(idx);
    slotsEl.appendChild(d);
  }
  // 灵化面板
  const inc = WF.i && WF.i[builds[state.wi].w];
  const incEl = document.getElementById("incpane");
  if(inc && incEl){
    const LBL = INCLBL;
    const rows = inc.picked.map(p=>{
      const parts = Object.keys(p.sc || {}).map(k=>{
        const v = p.sc[k];
        return `${LBL[k] || k} ${v > 0 ? "+" : ""}${num(v)}`;
      });
      return `<div class="ir"><span class="it">T${p.t}</span>
        <span class="in" title="${p.d.replace(/"/g,"&quot;")}">${p.n}</span>
        <span class="iv">${parts.join(" · ") || '<i style="color:#5a636e">行为型</i>'}</span></div>`;
    }).join("");
    incEl.innerHTML = `<div class="ihd"><span class="ihl">灵化 <b>${inc.name}</b></span>
      <div class="seg incseg">
        <button data-v="0" class="${state.incarnon?"":"on"}">普通形态</button>
        <button data-v="1" class="${state.incarnon?"on":""}">灵化形态</button>
      </div></div>
      <div class="ilist">${rows || '<div class="ir"><span class="iv">无已选节点</span></div>'}</div>
      <div class="ifoot">节点数值加在基础值上，再走 mod 乘算；基础伤害类只在灵化形态生效。</div>`;
    incEl.querySelectorAll(".incseg button").forEach(b=>{
      b.onclick = ()=>{ state.incarnon = b.dataset.v === "1"; renderBuild(); };
    });
  } else if(incEl){
    incEl.innerHTML = "";
  }
  bwrap.querySelectorAll(".tabs button").forEach(btn=>{
    btn.onclick = ()=>{
      state.ci = +btn.dataset.ci;
      state.slots = pad8(builds[state.wi].slots[state.ci]);
      renderBuild();
    };
  });
  recompute();
}

// ---------------------------------------------------------------- 选卡
let pickTarget = -1;
function openPicker(idx){
  pickTarget = idx;
  document.getElementById("modal").classList.add("on");
  document.getElementById("msearch").value = "";
  renderPicker();
  setTimeout(()=>document.getElementById("msearch").focus(),50);
}
document.getElementById("mclose").onclick = ()=>document.getElementById("modal").classList.remove("on");
document.getElementById("msearch").oninput = renderPicker;

function renderPicker(){
  const w = W[builds[state.wi].w];
  const want = CATT[w.cat] || "";
  const q = document.getElementById("msearch").value.trim().toLowerCase();
  const used = new Set(state.slots.filter(Boolean).map(s=>s.m));
  const rows = [];
  for(const uid in M){
    const m = M[uid];
    if(m.t !== want && m.t !== "---" && !(want==="SENTINEL" && m.t==="SENTINEL")) continue;
    if(q && !(m.n.toLowerCase().includes(q) || (m.z||"").toLowerCase().includes(q))) continue;
    if(used.has(uid)) continue;
    rows.push([uid,m]);
  }
  rows.sort((x,y)=>(x[1].z||x[1].n).localeCompare(y[1].z||y[1].n,"zh"));
  const el = document.getElementById("mlist");
  el.innerHTML = "";
  rows.slice(0,240).forEach(([uid,m])=>{
    const d = document.createElement("div");
    d.className = "mrow";
    d.innerHTML = `<div class="nm">${m.z&&m.z!==m.n?m.z:m.n}</div>
      <div class="meta">${m.d} 点 · ${m.mx} 级</div>`;
    d.onclick = ()=>{
      state.slots[pickTarget] = {m:uid, lv:m.mx};
      document.getElementById("modal").classList.remove("on");
      renderBuild();
    };
    el.appendChild(d);
  });
  document.getElementById("mfoot").textContent = `${rows.length} 个可用（${want||"全部"}）`;
}

// ---------------------------------------------------------------- 敌人
const eListEl = document.getElementById("enemyList");
document.getElementById("ecount").textContent = E.length + " 个";
const FAC_ORDER = ["Grineer","Kuva Grineer","Corpus","Corpus Amalgam","Infested",
  "Infested Deimos","Orokin","Sentient","Narmer","Murmur","Scaldra","Techrot","Stalker","Neutral"];
const facSet = new Set(E.map(e=>e.f));
const factions = ["全部", ...FAC_ORDER.filter(f=>facSet.has(f)), "其他"];
const chipsEl = document.getElementById("fchips");
factions.forEach(f=>{
  const b = document.createElement("button");
  b.textContent = f; if(f===state.fac) b.className="on";
  b.onclick = ()=>{ state.fac=f; renderEnemies();
    chipsEl.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.textContent===f)); };
  chipsEl.appendChild(b);
});
function facMatch(e){
  if(state.fac==="全部") return true;
  if(state.fac==="其他") return !FAC_ORDER.includes(e.f);
  return e.f===state.fac;
}
function renderEnemies(){
  const q = document.getElementById("esearch").value.trim().toLowerCase();
  eListEl.innerHTML = "";
  E.forEach((e,i)=>{
    if(!facMatch(e)) return;
    if(q && !e.n.toLowerCase().includes(q)) return;
    const d = document.createElement("div");
    d.className = "item" + (state.enemy && state.enemy.n===e.n ? " on" : "");
    const tag = e.fk ? "" : `<div class="badge lo">无克制</div>`;
    d.innerHTML = `<div class="nm">${e.n}</div>${tag}`;
    d.onclick = ()=>{ state.enemy = e; renderEnemies(); recompute(); };
    eListEl.appendChild(d);
  });
}
document.getElementById("esearch").oninput = renderEnemies;
state.enemy = E.find(e=>e.n==="Heavy Gunner") || E.find(e=>e.f==="Grineer") || E[0];

// ---------------------------------------------------------------- 交互
const rangeEl = document.getElementById("lvlrange"), numEl = document.getElementById("lvlnum");
rangeEl.oninput = ()=>{ state.level = +rangeEl.value; numEl.value = state.level; recompute(); };
numEl.oninput = ()=>{ state.level = Math.max(1, Math.min(9999, +numEl.value||1));
  rangeEl.value = Math.min(200, state.level); recompute(); };
document.querySelectorAll("#stseg button").forEach(b=>{
  b.onclick = ()=>{ state.status = b.dataset.v==="1";
    document.querySelectorAll("#stseg button").forEach(x=>x.classList.toggle("on",x===b)); recompute(); };
});
document.querySelectorAll("#spseg button").forEach(b=>{
  b.onclick = ()=>{ state.steel = b.dataset.v==="1";
    document.querySelectorAll("#spseg button").forEach(x=>x.classList.toggle("on",x===b)); recompute(); };
});

// 外部条件
function bindNum(rid, nid, key, lo, hi){
  const r = document.getElementById(rid), n = document.getElementById(nid);
  const sync = v=>{
    v = Math.max(lo, Math.min(hi, Math.round(v)||0));
    state[key] = v; r.value = Math.min(hi, v); n.value = v; recompute();
  };
  r.oninput = ()=>sync(+r.value);
  n.oninput = ()=>sync(+n.value);
}
bindNum("xvirR","xvir","extViral",0,10);
bindNum("xarmR","xarm","armorStrip",0,100);
bindNum("xwinR","xwin","window",3,60);
bindNum("xbufR","xbuf","dmgBuff",0,500);
bindNum("xccR","xcc","ccBuff",0,200);
document.getElementById("xhd").onchange = e=>{ state.headshot = e.target.checked; recompute(); };
document.getElementById("xcrit").onchange = e=>{ state.crit = e.target.checked; recompute(); };
document.getElementById("btnmode").onclick = ()=>{
  state.mode = state.mode==="rank" ? "weapon" : "rank";
  document.getElementById("btnmode").textContent = state.mode==="rank" ? "列表" : "排名";
  if(state.mode==="rank") buildRanking();
  renderWeapons();
};
document.getElementById("btnnote").onclick = showNote;
document.getElementById("btnriven").onclick = showRivens;

// ---------------------------------------------------------------- 结果
function fmt(n){
  if(!isFinite(n)||n===0) return n===0 ? "0" : "—";
  if(n>=1e6) return (n/1e6).toFixed(2)+"M";
  if(n>=1e4) return (n/1e3).toFixed(1)+"k";
  return Math.round(n).toLocaleString();
}
const opt = ()=>({steel:state.steel, status:state.status, extViral:state.extViral,
                  armorStrip:state.armorStrip, window:state.window,
                  headshot:state.headshot, crit:state.crit, incarnon:state.incarnon,
                  dmgBuff:state.dmgBuff, ccBuff:state.ccBuff});

function buildRanking(){
  const key = JSON.stringify([state.level, state.enemy.n, opt()]);
  if(state.rankingKey === key && state.ranking) return;
  const rows = builds.map((b,i)=>{
    const w = W[b.w];
    const r = compute(w, pad8Cache(b,0), state.enemy, state.level, opt(), b.w);
    const val = state.status ? (r.s ? r.s.dps : r.d.burst) : r.d.burst;
    return {idx:i, name:w.z||w.n, val};
  });
  rows.sort((a,b)=>b.val-a.val);
  state.ranking = rows; state.rankingKey = key;
}
const padCache = new Map();
function pad8Cache(b, ci){
  const k = b.w+"|"+ci;
  if(!padCache.has(k)) padCache.set(k, pad8(b.slots[ci]||[]));
  return padCache.get(k);
}

function recompute(){
  if(state.wi<0 || !state.enemy){ return; }
  const w = W[builds[state.wi].w];
  const r = compute(w, state.slots, state.enemy, state.level, opt(), builds[state.wi].w);
  const A = r.A, d = r.d, s = r.s;

  document.getElementById("rburst").textContent = fmt(d.burst);
  document.getElementById("rburstcmp").innerHTML =
    `每发 <b>${fmt(d.toHealth)}</b> · 裸伤 <b>${fmt(A.perShotShield)}</b> · 保留 <b>${(d.toHealth/A.perShotShield*100).toFixed(0)}%</b>`;

  if(s){
    document.getElementById("rdps").textContent = fmt(s.dps);
    document.getElementById("rdpscmp").innerHTML =
      `直伤 <b>${fmt(s.directDps)}</b> · DoT <b>${fmt(s.dotDps)}</b> · 病毒 <b>${s.viralAtEnd + (state.extViral||0)}</b> 层`;
  } else {
    document.getElementById("rdps").textContent = "—";
    document.getElementById("rdpscmp").innerHTML = "已关闭状态计算";
  }
  document.getElementById("dpslbl").textContent = `含状态 · ${state.window} 秒实战`;

  if(s && s.kill !== null){
    document.getElementById("rttk").textContent = s.kill.toFixed(2)+"s";
    document.getElementById("rttkcmp").innerHTML = `${state.window} 秒内击杀`;
  } else {
    document.getElementById("rttk").textContent = ">"+state.window+"s";
    document.getElementById("rttkcmp").innerHTML = `${state.window} 秒未击杀`;
  }

  // 目标面板
  document.getElementById("estat").innerHTML = `
    <div><span>血量</span><b>${fmt(A.hp)}</b></div>
    <div><span>护甲</span><b>${Math.round(A.ar0)}</b></div>
    <div><span>护盾</span><b>${fmt(A.sh)}</b></div>
    <div><span>护甲减伤</span><b>${(A.dr0*100).toFixed(0)}%</b></div>
    <div><span>实际等级</span><b>${A.lv}</b></div>
    <div><span>过载</span><b>${A.og?fmt(A.og):"—"}</b></div>`;

  const fm = FACMOD[A.fk] || null;
  let fr = "";
  if(fm){
    const plus = Object.keys(fm).filter(k=>fm[k]>1).map(k=>ZH[k]||k);
    const minus = Object.keys(fm).filter(k=>fm[k]<1).map(k=>ZH[k]||k);
    fr = `<b>${A.fk}</b> 弱点 ${plus.join(" / ")||"—"}` + (minus.length?` · 抗性 ${minus.join(" / ")}`:"");
  } else {
    fr = `<span class="warn">该目标没有阵营克制数据（按 ×1 计）</span>`;
  }
  if(A.banePct) fr += ` · 你的阵营卡 +${(A.banePct*100).toFixed(0)}%`;
  document.getElementById("facres").innerHTML = fr;

  // 10 秒推演
  const sp = document.getElementById("simpane");
  if(sp){
    if(s){
      const tot = (s.directDps + s.dotDps) || 1;
      const ehp = A.hp + A.sh + A.og;
      const dealt = s.dps * s.dur;
      sp.innerHTML = `<div class="hd">10 秒推演 · ${state.enemy.n} Lv${A.lv}</div>
        <div class="grid">
          <div class="cell"><span>病毒层</span><b>${s.viralAtEnd}</b></div>
          <div class="cell"><span>腐蚀层</span><b>${s.corrAtEnd}</b></div>
          <div class="cell"><span>剥甲</span><b>${(s.stripAtEnd*100).toFixed(0)}%</b></div>
          <div class="cell"><span>DoT 占比</span><b>${(s.dotDps/tot*100).toFixed(0)}%</b></div>
        </div>
        <div class="bar">
          <i style="width:${s.directDps/tot*100}%;background:var(--gold)"></i>
          <i style="width:${s.dotDps/tot*100}%;background:var(--red)"></i>
        </div>
        <div class="lg">
          <span><em style="color:var(--gold2)">■</em> 直伤 ${fmt(s.directDps)}</span>
          <span><em style="color:var(--red)">■</em> DoT ${fmt(s.dotDps)}</span>
          <span>有效血量 ${fmt(ehp)}</span>
          <span>10 秒打掉 ${(dealt/ehp*100).toFixed(1)}%</span>
        </div>`;
    } else {
      sp.innerHTML = `<div class="hd">直伤口径</div>
        <div class="note">已关闭状态计算：不含病毒、腐蚀剥甲与 DoT。</div>`;
    }
  }

  // 拆分
  let html = `<table class="brk"><thead><tr>
    <th>伤害类型</th><th>每发</th><th>阵营</th><th>减伤后</th><th>到血</th><th>占比</th>
    </tr></thead><tbody>`;
  for(const x of d.rows.slice().sort((a,b)=>b.vH-a.vH)){
    html += `<tr>
      <td><span class="dot" style="background:${COL[x.t]}"></span>${ZH[x.t]}</td>
      <td>${x.base.toFixed(1)}</td>
      <td class="${x.f>1?'pos':x.f<1?'neg':''}">${x.f!==1?("×"+x.f.toFixed(1)):"—"}</td>
      <td>${(x.dr*100).toFixed(0)}%</td>
      <td>${x.vH.toFixed(1)}</td>
      <td>${(x.share*100).toFixed(0)}%</td></tr>`;
  }
  html += `</tbody></table>`;
  document.getElementById("brk").innerHTML = html;

  if(state.mode==="rank"){ state.rankingKey=""; buildRanking(); renderWeapons(); }
}

// ---------------------------------------------------------------- 口径说明
function showNote(){
  const el = document.getElementById("modal");
  el.classList.add("on");
  document.getElementById("msearch").style.display="none";
  document.getElementById("mttl").style.display="";
  document.getElementById("mfoot").textContent = "点击任意处关闭";
  document.getElementById("mlist").innerHTML = `
  <div class="note" style="padding:10px 14px;font-size:12px">
  <p><b>克制</b>：Update 36（2024-06）之后血量/护甲/护盾类型已合并，克制只按阵营：弱点 ×1.5、抗性 ×0.5，按伤害类型查。旧表（Cloned Flesh / Ferrite / Alloy 那套）已失效。</p>
  <p><b>敌方护甲减伤</b>：<code>A ≤ 2700 → 0.9·√(A/2700)</code>，<code>A &gt; 2700 → A/(A+300)</code>。护甲按等级缩放后夹在 [200, 2700]。</p>
  <p><b>等级缩放</b>：Wiki 的双端点曲线 + smoothstep（L=70, U=80）。血量 q^2.12 / q^0.72，护甲 q^1.75 / q^0.75，护盾 q^1.76 / q^0.76。</p>
  <p><b>暴击</b>：按期望算 <code>1 + cc·(cm−1)</code>，超过 100% 时等效暴击阶层，公式仍成立。</p>
  <p><b>状态</b>：病毒首层 +100%、每层 +25%（10 层 +325%）；腐蚀 26%/层、上限 80%、8 秒；燃烧剥甲 50% 并 50% 火焰伤/秒；流血 35% 总伤/秒无视护甲；中毒 50% 毒素伤/秒无视护盾。触发按伤害占比分配。</p>
  <p><b>未建模</b>：连发/蓄力节奏、范围伤害、穿透多目标、磁力对护盾的加伤、冰缓的暴伤加成、镀层类条件叠层、紫卡以外的赋能与战甲技能公式。</p>
  <p><b>灵化</b>：形态数值取自 Voidforge 的 <code>incarnon.ts</code>（53 把武器），进化节点数值取自其 wiki 解析版。节点选择来自本机 <code>SkillTree</code> 字段（每一位是那一层选中的 slot）。<code>flatBaseDamage</code> / <code>additiveBaseDamage</code> 只在灵化形态生效；暴击、触发、射速等节点两形态都吃。近战灵化不换形态数值，只叠节点。</p>
  <p><b>紫卡</b>：公式来自 <code>calamity-inc/warframe-riven-info</code>：<code>基准值 × (1.5 × 倾向 × 10) × 1.25^负词条 × lerp(0.9,1.1,Value/0x3FFFFFFF) × 词条数衰减 × (等级+1)</code>。倾向系数用 DE 导出的 <code>omegaAttenuation</code>（674/839 是 1.2），<b>不是</b>游戏内每期调整后的实时 disposition，热门武器会偏乐观。装在配卡里的紫卡已经参与计算。</p>
  <p><b>数据</b>：武器与 mod 数值来自 DE PublicExport；敌人 497 条来自 warframe-damage.com；配卡与紫卡来自本机 lastData。</p>
  </div>`;
  document.getElementById("mlist").onclick = closeModal;
}
function closeModal(){
  document.getElementById("modal").classList.remove("on");
  document.getElementById("msearch").style.display="";
  document.getElementById("mttl").style.display="none";
  document.getElementById("msearch").oninput = renderPicker;
  document.getElementById("mlist").onclick = null;
}
function showRivens(){
  const R = WF.rv || [];
  const el = document.getElementById("modal");
  el.classList.add("on");
  document.getElementById("msearch").style.display="none";
  document.getElementById("mttl").style.display="";
  document.getElementById("mttl").textContent = `紫卡 ${R.length} 张（${R.filter(r=>r.lvl>=8).length} 张满级）`;
  document.getElementById("mfoot").textContent = "点击任意处关闭";
  const withW = R.filter(r=>r.compat).length;
  const head = `<div class="note" style="padding:9px 14px;font-size:11px;line-height:1.6">
    数值按 RivenParser 的公式在本地算：<code>基准值 × (1.5 × 倾向 × 10) × 1.25^负词条 × 0.9~1.1 随机 × 词条数衰减 × (等级+1)</code>。
    倾向系数取 DE 导出的 <code>omegaAttenuation</code>（多数武器 1.2），不是游戏内每期调整后的实时 disposition，
    热门武器会偏乐观。<b>${withW}</b> 张已开卡，<b>${R.length-withW}</b> 张未开。</div>`;
  const rows = R.map(r=>{
    const stats = r.s.length ? r.s.map(x=>{
      const v = (x.v == null) ? "—"
        : x.abs ? (x.v >= 0 ? "+" : "") + (x.v * 10).toFixed(1)
        : (x.v >= 0 ? "+" : "") + (x.v * 100).toFixed(1) + "%";
      return `<span class="st${x.c?" cur":""}">${v} ${x.n}</span>`;
    }).join("") : '<span class="st">未开卡</span>';
    return `<div class="rvr">
      <div class="rvh"><b>${r.nm}</b><span class="rw">${r.w}</span>
      <span class="rvt">Lv${r.lvl}/8 · 洗练 ${r.rr} · 倾向 ${r.disp}</span></div>
      <div class="rvs">${stats}</div></div>`;
  }).join("");
  document.getElementById("mlist").innerHTML = head + `<div class="rvlist">${rows}</div>`;
  document.getElementById("mlist").onclick = closeModal;
}

renderWeapons(); renderEnemies();
const defIdx = builds.findIndex(b=>b.w.includes("TenoraPrime"));
selectWeapon(defIdx >= 0 ? defIdx : 0);
const sel = eListEl.querySelector(".item.on");
if(sel) sel.scrollIntoView({block:"center"});
