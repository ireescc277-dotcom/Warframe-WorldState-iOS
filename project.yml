name: WarframeWatch
options:
  bundleIdPrefix: com.warframe
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Release
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
packages:
  DamageKit:
    path: Packages/DamageKit
targets:
  WarframeWatch:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WarframeWatch
        excludes:
          - "Info.plist"
      # 原生计算器数据包：只含武器、敌人、中文表和本地图标；不含网页或 JS 内核。
      - path: ios/DamageData
        type: folder
        buildPhase: resources
    dependencies:
      - package: DamageKit
    info:
      path: WarframeWatch/Info.plist
      properties:
        CFBundleDisplayName: "Warframe 世界状态"
        CFBundleShortVersionString: "1.5.1"
        CFBundleVersion: "15"
        UILaunchStoryboardName: LaunchScreen
        LSRequiresIPhoneOS: true
        UIDeviceFamily: [1]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: "用于在蹲守的任务（仲裁、裂隙、周期）出现或即将开始时提醒。"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.warframe.watch.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warframe.watch
        PRODUCT_NAME: WarframeWatch
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_CFBundleDisplayName: "Warframe 世界状态"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        # The plist is generated from INFOPLIST_KEY_* settings, which means the
        # values in `info.properties` above are ignored unless they also exist
        # as build settings. Without these two the shipped bundle had no
        # CFBundleShortVersionString and no CFBundleVersion at all, and most
        # sideload tools refuse a bundle like that.
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: "15"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - WarframeWatchTests
  WarframeWatchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WarframeWatchPackageTests
    dependencies:
      - target: WarframeWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warframe.watch.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
